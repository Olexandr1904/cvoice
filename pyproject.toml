[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cvoice"
version = "0.1.0"
description = "Spoken and banner reporting for Claude Code on macOS"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    # 7.2.x sends Sec-MS-GEC-Version 1-..., which the service now answers with 403.
    "edge-tts>=7.3.1",
    "tomli>=2.0; python_version<'3.11'",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
cvoice = "cvoice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cvoice = ["i18n/*.toml", "menubar/*.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
